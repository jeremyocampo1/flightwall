<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FlightWall">
<meta name="theme-color" content="#000000">
<title>FlightWall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --amber: #ffb000;
    --amber-dim: #8a5f00;
    --cyan: #3fe0ff;
    --green: #5dff7a;
    --white: #f4f1e8;
    --grey: #6b6b6b;
    --red: #ff4d4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    color: var(--amber);
    font-family: "VT323", "Courier New", monospace;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* LED dot-matrix overlay */
  body:after {
    content: "";
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 56%);
    background-size: 4px 4px;
    z-index: 50;
  }
  #stage {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    padding: 4vh 4vw;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-transition: -webkit-transform 2s ease; transition: transform 2s ease;
  }
  .glow { text-shadow: 0 0 6px currentColor, 0 0 18px rgba(255,176,0,0.35); }

  /* header row */
  #top {
    display: -webkit-flex; display: flex;
    -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-align-items: baseline; align-items: baseline;
    font-size: 4.2vh;
    color: var(--amber-dim);
    letter-spacing: 0.08em;
  }
  #top .right { text-align: right; }
  #clock { color: var(--amber); }

  /* main card */
  #card {
    -webkit-flex: 1; flex: 1;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-justify-content: center; justify-content: center;
    opacity: 1;
    -webkit-transition: opacity 0.5s ease; transition: opacity 0.5s ease;
  }
  #card.fade { opacity: 0; }
  #airline {
    font-size: 9vh;
    color: var(--white);
    letter-spacing: 0.04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1;
  }
  #flight {
    font-size: 5.5vh;
    color: var(--amber);
    margin-top: 1vh;
    letter-spacing: 0.1em;
  }
  #route {
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    margin-top: 3vh;
  }
  .apt { min-width: 0; }
  .apt .code { font-size: 22vh; line-height: 0.85; color: var(--amber); }
  .apt .city {
    font-size: 4.4vh; color: var(--amber-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 38vw;
  }
  .arrow {
    font-size: 14vh; color: var(--cyan);
    padding: 0 3vw; line-height: 1;
    -webkit-flex-shrink: 0; flex-shrink: 0;
  }
  #noroute { font-size: 7vh; color: var(--amber-dim); margin-top: 3vh; display: none; }

  #stats {
    display: -webkit-flex; display: flex;
    margin-top: 4vh;
    border-top: 2px solid #2a1d00;
    padding-top: 2.5vh;
  }
  .stat { -webkit-flex: 1; flex: 1; }
  .stat .label { font-size: 3.4vh; color: var(--grey); letter-spacing: 0.15em; }
  .stat .val { font-size: 7vh; color: var(--green); line-height: 1; white-space: nowrap; }
  .stat .val small { font-size: 3.6vh; color: var(--grey); margin-left: 0.3vw; }
  .stat:nth-child(1) { -webkit-flex: 1.25; flex: 1.25; }
  .stat:nth-child(4) { -webkit-flex: 1.4; flex: 1.4; }
  #type { text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; }
  #trend { font-size: 3.4vh; }
  #trend.up { color: var(--green); }
  #trend.down { color: var(--red); }

  /* footer: pager dots + status */
  #bottom {
    margin-top: auto;
    display: -webkit-flex; display: flex;
    -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-align-items: center; align-items: center;
    font-size: 3.4vh; color: var(--grey);
    letter-spacing: 0.08em;
  }
  #dots span {
    display: inline-block; width: 1.4vh; height: 1.4vh; margin-right: 0.9vh;
    background: #2a1d00;
  }
  #dots span.on { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

  /* empty state */
  #empty {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    text-align: center;
  }
  #empty .big { font-size: 12vh; color: var(--amber); }
  #empty .small { font-size: 4.5vh; color: var(--amber-dim); margin-top: 2vh; }

  /* settings panel */
  #settings {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    display: none;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
  }
  #settings.open { display: -webkit-flex; display: flex; }
  #settings .box {
    border: 2px solid var(--amber-dim);
    padding: 4vh 4vw;
    width: 80vw; max-width: 760px;
    font-size: 4vh;
  }
  #settings h2 { font-weight: normal; font-size: 6vh; color: var(--white); margin-bottom: 2vh; }
  #settings label { display: block; color: var(--amber-dim); margin-top: 1.8vh; }
  #settings input {
    width: 100%;
    background: #111; color: var(--amber);
    border: 1px solid #3a2a00;
    font-family: inherit; font-size: 4.2vh;
    padding: 0.6vh 1vw;
    -webkit-appearance: none; border-radius: 0;
  }
  #settings .row { display: -webkit-flex; display: flex; }
  #settings .row > div { -webkit-flex: 1; flex: 1; margin-right: 2vw; }
  #settings .row > div:last-child { margin-right: 0; }
  #settings .btns { margin-top: 3vh; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  #settings button {
    background: #000; color: var(--amber);
    border: 2px solid var(--amber);
    font-family: inherit; font-size: 4.2vh;
    padding: 0.8vh 2vw; margin: 0 1.5vw 1.5vh 0;
    -webkit-appearance: none; border-radius: 0;
  }
  #settings button.primary { background: var(--amber); color: #000; }
  #settings .hint { color: var(--grey); font-size: 3.2vh; margin-top: 1vh; }
</style>
</head>
<body>
<div id="stage">
  <div id="top">
    <div id="place" class="glow">NEARBY FLIGHTS</div>
    <div class="right"><span id="clock" class="glow">--:--</span></div>
  </div>

  <div id="card">
    <div id="airline" class="glow">&nbsp;</div>
    <div id="flight" class="glow">&nbsp;</div>
    <div id="route">
      <div class="apt">
        <div class="code glow" id="from">---</div>
        <div class="city" id="fromCity">&nbsp;</div>
      </div>
      <div class="arrow glow">&#9656;</div>
      <div class="apt">
        <div class="code glow" id="to">---</div>
        <div class="city" id="toCity">&nbsp;</div>
      </div>
    </div>
    <div id="noroute" class="glow">ROUTE UNKNOWN</div>
    <div id="stats">
      <div class="stat"><div class="label">ALTITUDE <span id="trend"></span></div><div class="val glow"><span id="alt">--</span><small>FT</small></div></div>
      <div class="stat"><div class="label">SPEED</div><div class="val glow"><span id="spd">--</span><small>KT</small></div></div>
      <div class="stat"><div class="label">DISTANCE</div><div class="val glow"><span id="dist">--</span><small>MI</small></div></div>
      <div class="stat"><div class="label">AIRCRAFT</div><div class="val glow" id="type">--</div></div>
    </div>
  </div>

  <div id="bottom">
    <div id="dots"></div>
    <div id="status">STARTING&hellip;</div>
  </div>

  <div id="empty">
    <div class="big glow" id="emptyBig">CLEAR SKIES</div>
    <div class="small" id="emptyMsg">No aircraft in range right now</div>
  </div>
</div>

<div id="settings">
  <div class="box">
    <h2>FLIGHTWALL SETTINGS</h2>
    <div class="row">
      <div><label>LATITUDE</label><input id="sLat" inputmode="decimal"></div>
      <div><label>LONGITUDE</label><input id="sLon" inputmode="decimal"></div>
    </div>
    <div class="row">
      <div><label>RADIUS (MILES)</label><input id="sRad" inputmode="decimal"></div>
      <div><label>MAX ALTITUDE (FT)</label><input id="sAlt" inputmode="numeric"></div>
      <div><label>SECONDS PER PLANE</label><input id="sCycle" inputmode="numeric"></div>
    </div>
    <label>PLACE NAME (TOP-LEFT LABEL)</label><input id="sName">
    <div class="hint">Tip: long-press a spot in Apple/Google Maps to copy its coordinates.</div>
    <div class="btns">
      <button class="primary" id="bSave">SAVE</button>
      <button id="bLocate">USE MY LOCATION</button>
      <button id="bFull">FULL SCREEN</button>
      <button id="bClose">CLOSE</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Relay ----------
  // Paste your Cloudflare Worker address between the quotes, e.g.
  // var RELAY = "https://flightwall.yourname.workers.dev";
  var RELAY = "https://flightwall.jeremy-ocampo1.workers.dev";
  if (RELAY.indexOf("http") !== 0) RELAY = "";
  RELAY = RELAY.replace(/\/+$/, "");

  // ---------- Config ----------
  var DEFAULTS = {
    lat: 40.7178,      // Downtown Jersey City
    lon: -74.0431,
    radius: 6,         // miles
    maxAlt: 20000,     // ft; planes above this are ignored (cruising traffic)
    cycle: 8,          // seconds per plane
    name: "JERSEY CITY"
  };
  var REFRESH_MS = 12000;

  function loadCfg() {
    var cfg = {}, k;
    for (k in DEFAULTS) cfg[k] = DEFAULTS[k];
    try {
      var saved = JSON.parse(localStorage.getItem("fw_cfg") || "{}");
      for (k in saved) if (saved[k] !== null && saved[k] !== "") cfg[k] = saved[k];
    } catch (e) {}
    // URL overrides: ?lat=..&lon=..&r=..&alt=..&name=..
    try {
      var q = window.location.search.replace(/^\?/, "").split("&");
      for (var i = 0; i < q.length; i++) {
        var p = q[i].split("="), key = decodeURIComponent(p[0] || ""), v = decodeURIComponent(p[1] || "");
        if (!v) continue;
        if (key === "lat") cfg.lat = parseFloat(v);
        if (key === "lon") cfg.lon = parseFloat(v);
        if (key === "r") cfg.radius = parseFloat(v);
        if (key === "alt") cfg.maxAlt = parseFloat(v);
        if (key === "name") cfg.name = v;
      }
    } catch (e) {}
    cfg.lat = +cfg.lat; cfg.lon = +cfg.lon; cfg.radius = +cfg.radius;
    cfg.maxAlt = +cfg.maxAlt; cfg.cycle = Math.max(3, +cfg.cycle || 8);
    return cfg;
  }
  function saveCfg(c) { try { localStorage.setItem("fw_cfg", JSON.stringify(c)); } catch (e) {} }

  var cfg = loadCfg();

  // ---------- Helpers ----------
  function $(id) { return document.getElementById(id); }
  function setText(id, t) { var el = $(id); if (el) el.textContent = (t === undefined || t === null || t === "") ? " " : t; }

  function fetchJSON(url, ms) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.timeout = ms || 8000;
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(e); }
        } else { var err = new Error("HTTP " + xhr.status); err.status = xhr.status; reject(err); }
      };
      xhr.onerror = function () { reject(new Error("network")); };
      xhr.ontimeout = function () { reject(new Error("timeout")); };
      xhr.send();
    });
  }

  function haversineMi(lat1, lon1, lat2, lon2) {
    var R = 3958.8, toR = Math.PI / 180;
    var dLat = (lat2 - lat1) * toR, dLon = (lon2 - lon1) * toR;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * toR) * Math.cos(lat2 * toR) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function fmtNum(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  // ---------- Data sources (all free, no key; tried in order) ----------
  function sources() {
    var nm = Math.max(1, Math.ceil(cfg.radius * 0.869 + 1)); // miles -> nautical miles, slight pad
    var la = cfg.lat.toFixed(4), lo = cfg.lon.toFixed(4);
    if (RELAY) return [
      { name: "relay", url: RELAY + "/planes?lat=" + la + "&lon=" + lo + "&nm=" + nm }
    ];
    return [
      { name: "adsb.lol",      url: "https://api.adsb.lol/v2/point/" + la + "/" + lo + "/" + nm },
      { name: "airplanes.live", url: "https://api.airplanes.live/v2/point/" + la + "/" + lo + "/" + nm },
      { name: "adsb.fi",       url: "https://opendata.adsb.fi/api/v2/lat/" + la + "/lon/" + lo + "/dist/" + nm }
    ];
  }
  var preferred = 0;
  var lastErr = "";

  function getAircraft() {
    var list = sources();
    var order = [];
    for (var i = 0; i < list.length; i++) order.push(list[(preferred + i) % list.length]);
    var idx = 0;
    function attempt() {
      if (idx >= order.length) return Promise.reject(new Error("all sources failed"));
      var s = order[idx++];
      return fetchJSON(s.url, 8000).then(function (d) {
        preferred = list.indexOf(s);
        return { src: d.src || s.name, ac: d.ac || d.aircraft || [] };
      }, function (e) {
        lastErr = s.name + ": " + (e && e.message ? e.message : "failed");
        return attempt();
      });
    }
    return attempt();
  }

  // ---------- Route + airline lookup (adsbdb, cached) ----------
  var routeCache = {};
  function getRoute(callsign) {
    if (!callsign) return Promise.resolve(null);
    if (routeCache.hasOwnProperty(callsign)) return Promise.resolve(routeCache[callsign]);
    return fetchJSON((RELAY ? RELAY + "/route/" : "https://api.adsbdb.com/v0/callsign/") + encodeURIComponent(callsign), 6000).then(function (d) {
      var fr = d && d.response && d.response.flightroute;
      var r = fr ? {
        airline: fr.airline ? fr.airline.name : null,
        iataFlight: fr.callsign_iata || null,
        from: fr.origin ? (fr.origin.iata_code || fr.origin.icao_code) : null,
        fromCity: fr.origin ? (fr.origin.municipality || fr.origin.name) : null,
        to: fr.destination ? (fr.destination.iata_code || fr.destination.icao_code) : null,
        toCity: fr.destination ? (fr.destination.municipality || fr.destination.name) : null
      } : null;
      routeCache[callsign] = r;
      return r;
    }, function (e) {
      if (e && e.status === 404) routeCache[callsign] = null; // known-unknown; don't retry
      return null;
    });
  }

  // Friendly aircraft type names for common ICAO codes
  var TYPES = {
    A19N:"A319neo",A20N:"A320neo",A21N:"A321neo",A319:"A319",A320:"A320",A321:"A321",A318:"A318",
    A332:"A330-200",A333:"A330-300",A339:"A330-900",A359:"A350-900",A35K:"A350-1000",A388:"A380",
    BCS1:"A220-100",BCS3:"A220-300",
    B712:"717",B737:"737-700",B738:"737-800",B739:"737-900",B38M:"737 MAX 8",B39M:"737 MAX 9",B3XM:"737 MAX 10",
    B752:"757-200",B753:"757-300",B762:"767-200",B763:"767-300",B764:"767-400",
    B772:"777-200",B77L:"777-200LR",B77W:"777-300ER",B778:"777-8",B779:"777-9",
    B788:"787-8",B789:"787-9",B78X:"787-10",B744:"747-400",B748:"747-8",
    E170:"E170",E75L:"E175",E75S:"E175",E190:"E190",E195:"E195",E290:"E190-E2",
    CRJ2:"CRJ-200",CRJ7:"CRJ-700",CRJ9:"CRJ-900",DH8D:"Dash 8-400",AT76:"ATR 72",
    C172:"Cessna 172",C182:"Cessna 182",SR22:"Cirrus SR22",PC12:"Pilatus PC-12",
    R44:"Robinson R44",EC35:"H135",EC45:"H145",S76:"Sikorsky S-76",A109:"AW109",B407:"Bell 407",AS50:"AS350",
    GLF4:"Gulfstream IV",GLF5:"Gulfstream V",GLF6:"G650",GLEX:"Global Express",CL60:"Challenger 600",
    C68A:"Citation Latitude",C56X:"Citation Excel",E55P:"Phenom 300",LJ45:"Learjet 45"
  };
  function typeName(a) {
    if (a.t && TYPES[a.t]) return TYPES[a.t];
    return a.t || "--";
  }

  // ---------- State ----------
  var planes = [];       // current sorted list
  var cur = 0;
  var lastSrc = "";
  var lastOk = 0;
  var cycleTimer = null;

  function normalize(raw) {
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var a = raw[i];
      if (a.lat === undefined || a.lon === undefined) continue;
      if (a.alt_baro === "ground") continue;
      var alt = typeof a.alt_baro === "number" ? a.alt_baro : (typeof a.alt_geom === "number" ? a.alt_geom : null);
      if (alt !== null && cfg.maxAlt && alt > cfg.maxAlt) continue;
      var d = haversineMi(cfg.lat, cfg.lon, a.lat, a.lon);
      if (d > cfg.radius) continue;
      out.push({
        hex: a.hex,
        callsign: (a.flight || "").trim(),
        reg: a.r || "",
        alt: alt,
        rate: typeof a.baro_rate === "number" ? a.baro_rate : (typeof a.geom_rate === "number" ? a.geom_rate : 0),
        spd: typeof a.gs === "number" ? a.gs : null,
        dist: d,
        type: typeName(a),
        desc: a.desc || ""
      });
    }
    out.sort(function (x, y) { return x.dist - y.dist; });
    return out.slice(0, 8);
  }

  function refresh() {
    getAircraft().then(function (res) {
      lastSrc = res.src; lastOk = Date.now();
      var fresh = normalize(res.ac);
      // keep the plane currently on screen in place if still present
      var curHex = planes[cur] ? planes[cur].hex : null;
      planes = fresh;
      cur = 0;
      if (curHex) for (var i = 0; i < planes.length; i++) if (planes[i].hex === curHex) { cur = i; break; }
      // prefetch routes
      for (var j = 0; j < planes.length; j++) getRoute(planes[j].callsign);
      render(false);
      updateStatus();
    }, function () {
      updateStatus(true);
      if (!planes.length) render(false);
    });
  }

  function updateStatus(err) {
    var age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : null;
    var s = (err ? "RETRYING · " : "") + (lastSrc ? "LIVE · " + lastSrc.toUpperCase() : "CONNECTING");
    if (age !== null && age > 30) s = "SIGNAL LOST " + age + "s · RETRYING";
    s += " · " + planes.length + " IN " + cfg.radius + " MI";
    setText("status", s);
  }

  function renderDots() {
    var html = "";
    for (var i = 0; i < planes.length; i++) html += '<span class="' + (i === cur ? "on" : "") + '"></span>';
    $("dots").innerHTML = html;
  }

  var renderToken = 0;
  function render(animate) {
    var card = $("card"), empty = $("empty");
    if (!planes.length) {
      card.style.display = "none";
      $("stats").style.display = "none";
      empty.style.display = "-webkit-flex"; empty.style.display = "flex";
      setText("emptyBig", (!lastOk && lastErr) ? "NO SIGNAL" : "CLEAR SKIES");
      setText("emptyMsg", lastOk ? "No aircraft below " + fmtNum(cfg.maxAlt) + " ft within " + cfg.radius + " mi" : (lastErr ? "Can't reach flight data · " + lastErr + (RELAY ? "" : " · no relay set") : "Connecting to flight data…"));
      renderDots();
      return;
    }
    empty.style.display = "none";
    card.style.display = "";
    $("stats").style.display = "";
    var p = planes[cur];
    var token = ++renderToken;

    function paint(r) {
      if (token !== renderToken) return;
      var airline = (r && r.airline) || (p.callsign ? "" : "") ;
      if (!airline) airline = p.desc ? p.desc : (p.reg ? p.reg : "AIRCRAFT " + (p.hex || "").toUpperCase());
      setText("airline", airline.toUpperCase());
      var fl = [];
      if (r && r.iataFlight && r.iataFlight !== p.callsign) fl.push(r.iataFlight);
      if (p.callsign) fl.push(p.callsign);
      if (p.reg && fl.indexOf(p.reg) < 0) fl.push(p.reg);
      setText("flight", fl.join("  ·  "));

      if (r && r.from && r.to) {
        $("route").style.display = "";
        $("noroute").style.display = "none";
        setText("from", r.from); setText("to", r.to);
        setText("fromCity", (r.fromCity || "").toUpperCase());
        setText("toCity", (r.toCity || "").toUpperCase());
      } else {
        $("route").style.display = "none";
        $("noroute").style.display = "block";
        setText("noroute", p.callsign ? "ROUTE UNKNOWN" : "PRIVATE / LOCAL FLIGHT");
      }

      setText("alt", p.alt !== null ? fmtNum(p.alt) : "--");
      var tr = $("trend");
      if (p.rate > 300) { tr.textContent = "▲"; tr.className = "up"; }
      else if (p.rate < -300) { tr.textContent = "▼"; tr.className = "down"; }
      else { tr.textContent = ""; tr.className = ""; }
      setText("spd", p.spd !== null ? Math.round(p.spd) : "--");
      setText("dist", p.dist.toFixed(1));
      setText("type", p.type);
      renderDots();
    }

    var routeP = getRoute(p.callsign);
    if (animate) {
      card.className = "fade";
      setTimeout(function () {
        routeP.then(function (r) { paint(r); card.className = ""; });
      }, 450);
    } else {
      routeP.then(paint);
    }
  }

  function next() {
    if (planes.length > 1) {
      cur = (cur + 1) % planes.length;
      render(true);
    }
  }

  function startCycle() {
    if (cycleTimer) clearInterval(cycleTimer);
    cycleTimer = setInterval(next, cfg.cycle * 1000);
  }

  // ---------- Clock + header ----------
  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
    setText("clock", h + ":" + (m < 10 ? "0" : "") + m + " " + ap);
  }
  function header() { setText("place", (cfg.name || "NEARBY FLIGHTS").toUpperCase()); }

  // ---------- Burn-in protection: drift the whole layout a few px ----------
  var shifts = [[0,0],[6,4],[-5,6],[4,-5],[-6,-3],[3,7]], si = 0;
  setInterval(function () {
    si = (si + 1) % shifts.length;
    var s = shifts[si];
    $("stage").style.webkitTransform = "translate(" + s[0] + "px," + s[1] + "px)";
    $("stage").style.transform = "translate(" + s[0] + "px," + s[1] + "px)";
  }, 90000);

  // ---------- Settings ----------
  function openSettings() {
    $("sLat").value = cfg.lat; $("sLon").value = cfg.lon;
    $("sRad").value = cfg.radius; $("sAlt").value = cfg.maxAlt;
    $("sCycle").value = cfg.cycle; $("sName").value = cfg.name;
    $("settings").className = "open";
  }
  function closeSettings() { $("settings").className = ""; }

  // Tap anywhere = next plane; long-press (or double-tap) = settings
  var pressTimer = null, lastTap = 0;
  $("stage").addEventListener("touchstart", function () {
    pressTimer = setTimeout(function () { pressTimer = null; openSettings(); }, 700);
  }, { passive: true });
  $("stage").addEventListener("touchend", function (e) {
    if (pressTimer) {
      clearTimeout(pressTimer); pressTimer = null;
      var now = Date.now();
      if (now - lastTap < 350) { openSettings(); lastTap = 0; }
      else { lastTap = now; next(); startCycle(); }
    }
    e.preventDefault();
  });
  $("stage").addEventListener("click", function () { next(); startCycle(); }); // desktop
  $("stage").addEventListener("dblclick", openSettings);

  $("bClose").addEventListener("click", closeSettings);
  $("bSave").addEventListener("click", function () {
    var n = {
      lat: parseFloat($("sLat").value), lon: parseFloat($("sLon").value),
      radius: parseFloat($("sRad").value), maxAlt: parseFloat($("sAlt").value),
      cycle: parseFloat($("sCycle").value), name: $("sName").value
    };
    if (isNaN(n.lat) || isNaN(n.lon)) { $("sLat").focus(); return; }
    for (var k in n) if (n[k] !== "" && !(typeof n[k] === "number" && isNaN(n[k]))) cfg[k] = n[k];
    saveCfg(cfg);
    cfg = loadCfg();
    closeSettings(); header(); startCycle();
    planes = []; cur = 0; render(false); refresh();
  });
  $("bLocate").addEventListener("click", function () {
    if (!navigator.geolocation) return;
    $("bLocate").textContent = "LOCATING…";
    navigator.geolocation.getCurrentPosition(function (pos) {
      $("sLat").value = pos.coords.latitude.toFixed(4);
      $("sLon").value = pos.coords.longitude.toFixed(4);
      $("bLocate").textContent = "USE MY LOCATION";
    }, function () { $("bLocate").textContent = "LOCATION BLOCKED"; }, { timeout: 10000 });
  });
  $("bFull").addEventListener("click", function () {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
    closeSettings();
  });

  // ---------- Go ----------
  header(); tick(); setInterval(tick, 10000);
  render(false);
  refresh();
  setInterval(refresh, REFRESH_MS);
  setInterval(function () { if (lastOk) updateStatus(); }, 5000);
  startCycle();

  // Reload once a day so a long-running Safari tab stays healthy
  setTimeout(function () { window.location.reload(); }, 24 * 3600 * 1000);
})();
</script>
</body>
</html>
